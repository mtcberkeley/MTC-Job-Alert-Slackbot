name: Internship Scout (hourly)

on:
  schedule:
    # Runs at minute 0 of every hour, UTC. Edit the cron expression to
    # change frequency (e.g. "*/30 * * * *" for every 30 minutes).
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

permissions:
  contents: write  # needed to commit the updated seen_listings.json back

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run internship scout
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_INTERNSHIP_CHANNEL: ${{ vars.SLACK_INTERNSHIP_CHANNEL }}
          SLACK_FULLTIME_CHANNEL: ${{ vars.SLACK_FULLTIME_CHANNEL }}
        run: python main.py

      - name: Commit updated seen-listings state
        run: |
          git config user.name "internship-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_listings.json
          git diff --cached --quiet || git commit -m "Update seen listings [skip ci]"
          git push
